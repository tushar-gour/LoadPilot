name: Runtime and platform verification
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm pack --dry-run --cache .npm
      - run: npm run bench:memory -- --scenarios idle --duration 0.1 --idle 0 --warmup 0 --label ci-memory
      - run: npm run bench:capacity -- --rates 100 --profiles get --duration 0.1 --warmup 0 --repetitions 1 --label ci-capacity
      - name: Six-strategy benchmark smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: npm run bench:algorithms -- --profiles uniform,unhealthy --duration 0.2 --warmup 0.1 --concurrency 8 --repetitions 1 --label ci-algorithms
